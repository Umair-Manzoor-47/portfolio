<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="stHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="stAwsAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="stCloudBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="stDataGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="stShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="480" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top Title Bar -->
  <rect x="24" y="24" width="872" height="64" rx="10" fill="url(#stHeaderGrad)"/>
  <text x="460" y="52" text-anchor="middle" fill="#F8FAFC" font-size="18" font-weight="700" letter-spacing="0.5">AWS Cloud Backend &amp; High-Scale Infrastructure</text>
  <text x="460" y="73" text-anchor="middle" fill="#94A3B8" font-size="12">Short Drama/Reels Streaming Backend, Auth, and Low-Latency Telemetry (50M+ Downloads)</text>

  <!-- 3 Pipeline Columns -->
  <!-- 1. Client Ingress & Edge CDN -->
  <g transform="translate(24, 110)" filter="url(#stShadow)">
    <rect width="270" height="230" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <rect width="270" height="38" rx="10" fill="url(#stAwsAmber)"/>
    <rect y="28" width="270" height="10" fill="url(#stAwsAmber)"/>
    <text x="135" y="24" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">1. Client Ingress &amp; Edge CDN</text>

    <text x="16" y="64" fill="#B45309" font-size="11" font-weight="700">TRAFFIC ROUTING &amp; DELIVERY</text>
    <text x="16" y="86" fill="#334155" font-size="12">• Global Amazon CloudFront CDN</text>
    <text x="16" y="106" fill="#334155" font-size="12">• AWS Route 53 DNS routing</text>
    <text x="16" y="126" fill="#334155" font-size="12">• AWS API Gateway endpoints</text>
    <text x="16" y="146" fill="#334155" font-size="12">• SSL/TLS termination &amp; WAF</text>
    <text x="16" y="166" fill="#334155" font-size="12">• Adaptive bitrate HLS streaming</text>

    <rect x="16" y="186" width="238" height="28" rx="6" fill="#FFFBEB"/>
    <text x="135" y="204" text-anchor="middle" fill="#D97706" font-size="11" font-weight="600">Global Edge Acceleration</text>
  </g>

  <!-- 2. Microservices & Application Logic -->
  <g transform="translate(325, 110)" filter="url(#stShadow)">
    <rect width="270" height="230" rx="10" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <rect width="270" height="38" rx="10" fill="url(#stCloudBlue)"/>
    <rect y="28" width="270" height="10" fill="url(#stCloudBlue)"/>
    <text x="135" y="24" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">2. Backend Cloud Services</text>

    <text x="16" y="64" fill="#0369A1" font-size="11" font-weight="700">STATELESS API SERVICES</text>
    <text x="16" y="86" fill="#334155" font-size="12">• JWT Auth &amp; Session validation</text>
    <text x="16" y="106" fill="#334155" font-size="12">• Media catalogue &amp; metadata API</text>
    <text x="16" y="126" fill="#334155" font-size="12">• User profile &amp; watchlist sync</text>
    <text x="16" y="146" fill="#334155" font-size="12">• Dynamic feed pagination logic</text>
    <text x="16" y="166" fill="#334155" font-size="12">• High-concurrency auto-scaling</text>

    <rect x="16" y="186" width="238" height="28" rx="6" fill="#F0F9FF"/>
    <text x="135" y="204" text-anchor="middle" fill="#0284C7" font-size="11" font-weight="600">Stateless Resilient Services</text>
  </g>

  <!-- 3. Persistence & Telemetry -->
  <g transform="translate(626, 110)" filter="url(#stShadow)">
    <rect width="270" height="230" rx="10" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
    <rect width="270" height="38" rx="10" fill="url(#stDataGreen)"/>
    <rect y="28" width="270" height="10" fill="url(#stDataGreen)"/>
    <text x="135" y="24" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">3. Storage &amp; Live Telemetry</text>

    <text x="16" y="64" fill="#047857" font-size="11" font-weight="700">PERSISTENCE &amp; ANALYTICS</text>
    <text x="16" y="86" fill="#334155" font-size="12">• Amazon S3 video media storage</text>
    <text x="16" y="106" fill="#334155" font-size="12">• Redis ElastiCache session cache</text>
    <text x="16" y="126" fill="#334155" font-size="12">• DynamoDB high-throughput tables</text>
    <text x="16" y="146" fill="#334155" font-size="12">• CloudWatch logs &amp; performance</text>
    <text x="16" y="166" fill="#334155" font-size="12">• Live telemetry event pipelines</text>

    <rect x="16" y="186" width="238" height="28" rx="6" fill="#ECFDF5"/>
    <text x="135" y="204" text-anchor="middle" fill="#059669" font-size="11" font-weight="600">Sub-10ms Cache Lookups</text>
  </g>

  <!-- Bottom Architecture Metrics Bar -->
  <g transform="translate(24, 360)">
    <rect width="872" height="96" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <g transform="translate(20, 16)">
      <rect width="260" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="130" y="28" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">Scale &amp; Reliability</text>
      <text x="130" y="48" text-anchor="middle" fill="#64748B" font-size="11">50M+ downloads with 99.9% uptime</text>
    </g>

    <g transform="translate(306, 16)">
      <rect width="260" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="130" y="28" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">Client Memory Discipline</text>
      <text x="130" y="48" text-anchor="middle" fill="#64748B" font-size="11">60 FPS on low-to-mid range devices</text>
    </g>

    <g transform="translate(592, 16)">
      <rect width="260" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="130" y="28" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">End-to-End Delivery</text>
      <text x="130" y="48" text-anchor="middle" fill="#64748B" font-size="11">CloudFront CDN + S3 video streaming</text>
    </g>
  </g>
</svg>