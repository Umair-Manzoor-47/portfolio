<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background:#0F172A; font-family:'JetBrains Mono', Consolas, sans-serif;">
  <rect width="600" height="400" fill="#0B132B" />
  <rect x="20" y="20" width="560" height="360" rx="8" fill="#131C31" stroke="#253550" stroke-width="1.2" />
  
  <text x="40" y="55" fill="#38BDF8" font-size="14" font-weight="700">DECLARATIVE RUNTIME MAPPING</text>
  <text x="40" y="75" fill="#64748B" font-size="11">Translating declarative YAML/JSON directly into reactive Flutter widgets</text>

  <!-- Flow visual -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="220" height="85" rx="6" fill="#1E293B" stroke="#334155" />
    <text x="15" y="28" fill="#FBBF24" font-size="11" font-weight="700">DECLARATIVE SCHEMA</text>
    <text x="15" y="52" fill="#E2E8F0" font-size="11">Button:</text>
    <text x="30" y="72" fill="#38BDF8" font-size="11">label: "Submit Order"</text>

    <!-- Arrow -->
    <path d="M 230 42 L 290 42" stroke="#38BDF8" stroke-width="2.5" />
    <polygon points="290,38 298,42 290,46" fill="#38BDF8" />

    <rect x="300" y="0" width="220" height="85" rx="6" fill="#0E1726" stroke="#0284C7" stroke-width="1.2" />
    <text x="315" y="28" fill="#38BDF8" font-size="11" font-weight="700">NATIVE FLUTTER TREE</text>
    <text x="315" y="52" fill="#34D399" font-size="11">ElevatedButton(child: ...)</text>
    <text x="315" y="72" fill="#64748B" font-size="10">Zero compile wait / live sync</text>
  </g>

  <!-- Explanation -->
  <g transform="translate(40, 205)">
    <rect x="0" y="0" width="520" height="90" rx="6" fill="#0E1726" stroke="#1E2B40" stroke-width="1" />
    <text x="15" y="25" fill="#94A3B8" font-size="11" font-weight="700">INSTANT APP DELIVERABILITY</text>
    <text x="15" y="50" fill="#38BDF8" font-size="12" font-weight="700">Dynamic layout changes stream down without App Store approvals.</text>
    <text x="15" y="70" fill="#64748B" font-size="11">Implemented core components used across production mobile applications.</text>
  </g>

  <!-- Bottom Metric Callout -->
  <rect x="40" y="315" width="520" height="45" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="55" y="342" fill="#38BDF8" font-size="12" font-weight="700">DYNAMIC DECLARATIVE PLATFORM :: CODE-FREE APP RELEASES</text>
</svg>
