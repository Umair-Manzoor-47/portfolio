<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="#253248" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Isometric CPU Package Substrate -->
  <polygon points="100,10 180,45 100,80 20,45" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <polygon points="20,45 100,80 100,90 20,55" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <polygon points="100,80 180,45 180,55 100,90" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Integrated Heat Spreader (IHS) Bevel -->
  <polygon points="100,20 160,46 100,72 40,46" stroke="#334155" stroke-width="1.2" />

  <!-- Multi-Level Cache Die Floorplan -->
  <!-- L1 & L2 Core Cache Slices -->
  <polygon points="80,33 100,42 90,48 70,39" stroke="#0284C7" stroke-width="1.2" />
  <polygon points="105,33 125,42 115,48 95,39" stroke="#0284C7" stroke-width="1.2" />
  <polygon points="90,48 110,57 100,63 80,54" stroke="#0284C7" stroke-width="1.2" />
  <polygon points="115,48 135,57 125,63 105,54" stroke="#0284C7" stroke-width="1.2" />

  <!-- L3 Shared Cache Central Ring Line -->
  <ellipse cx="100" cy="46" rx="14" ry="7" stroke="#F59E0B" stroke-dasharray="2 2" stroke-width="1" />
  <circle cx="100" cy="46" r="2" fill="#F59E0B" />

  <!-- Substrate Contact Pin Leads -->
  <line x1="50" y1="68" x2="50" y2="105" stroke="#64748B" stroke-width="0.9" />
  <line x1="80" y1="81" x2="80" y2="115" stroke="#64748B" stroke-width="0.9" />
  <line x1="120" y1="81" x2="120" y2="115" stroke="#64748B" stroke-width="0.9" />
  <line x1="150" y1="68" x2="150" y2="105" stroke="#64748B" stroke-width="0.9" />
  <circle cx="50" cy="105" r="2" fill="#64748B" />
  <circle cx="80" cy="115" r="2" fill="#64748B" />
  <circle cx="120" cy="115" r="2" fill="#64748B" />
  <circle cx="150" cy="105" r="2" fill="#64748B" />

  <!-- Blueprint Dimension & Annotation -->
  <text x="100" y="145" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1">L1/L2/L3 CACHE DIE</text>
  <line x1="30" y1="152" x2="170" y2="152" stroke="#94A3B8" stroke-dasharray="2 2" stroke-width="0.8" />
</svg>
