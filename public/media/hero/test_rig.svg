<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 340" fill="none" stroke="#253248" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Vertical Fluid Columns / Run Tanks -->
  <rect x="50" y="30" width="22" height="150" rx="3" fill="none" stroke-width="1.3" />
  <ellipse cx="61" cy="30" rx="11" ry="5" />
  <ellipse cx="61" cy="180" rx="11" ry="5" />

  <rect x="85" y="10" width="26" height="170" rx="3" fill="none" stroke-width="1.3" />
  <ellipse cx="98" cy="10" rx="13" ry="6" />
  <ellipse cx="98" cy="180" rx="13" ry="6" />

  <!-- Top Feed Piping & Regulators -->
  <path d="M 61 25 L 61 10 L 85 10" stroke-width="1.2" />
  <path d="M 98 4 L 98 -4 L 115 -4 L 115 40 L 98 40" stroke-width="1.2" />
  <!-- Handwheel / Relief Valve -->
  <circle cx="115" cy="10" r="4" />
  <line x1="115" y1="6" x2="115" y2="14" />
  <line x1="111" y1="10" x2="119" y2="10" />

  <!-- Pressure Transducers & Interconnect Lines -->
  <path d="M 40 70 L 50 70 M 40 110 L 50 110 M 40 150 L 50 150" stroke-width="1.2" />
  <circle cx="36" cy="70" r="3" />
  <circle cx="36" cy="110" r="3" />
  <circle cx="36" cy="150" r="3" />

  <!-- Horizontal Test Stand Structural Bed (Isometric Truss) -->
  <!-- Top Deck -->
  <polygon points="40,180 180,180 220,205 80,205" fill="none" stroke-width="1.4" />
  <!-- Thrust Cell Cutout -->
  <polygon points="100,185 170,185 195,200 125,200" fill="none" stroke-width="1.2" />

  <!-- Bottom Bed -->
  <polygon points="40,260 180,260 220,285 80,285" fill="none" stroke-width="1.4" />

  <!-- Vertical Legs -->
  <line x1="40" y1="180" x2="40" y2="260" stroke-width="1.5" />
  <line x1="180" y1="180" x2="180" y2="260" stroke-width="1.5" />
  <line x1="220" y1="205" x2="220" y2="285" stroke-width="1.5" />
  <line x1="80" y1="205" x2="80" y2="285" stroke-width="1.5" />

  <!-- Diagonal Bracing (X-Bracing) -->
  <line x1="40" y1="180" x2="80" y2="285" stroke="#475569" stroke-width="1" />
  <line x1="40" y1="260" x2="80" y2="205" stroke="#475569" stroke-width="1" />
  <line x1="80" y1="205" x2="220" y2="285" stroke="#475569" stroke-width="1" />
  <line x1="80" y1="285" x2="220" y2="205" stroke="#475569" stroke-width="1" />

  <!-- Horizontal Thrust Mount Cylinder / Engine Bell on Stand -->
  <g transform="translate(140, 195) rotate(15)">
    <!-- Mounting Ring Flange -->
    <ellipse cx="20" cy="20" rx="14" ry="22" stroke-width="1.4" />
    <circle cx="20" cy="5" r="1.5" fill="#253248" />
    <circle cx="20" cy="35" r="1.5" fill="#253248" />
    <circle cx="10" cy="20" r="1.5" fill="#253248" />
    <circle cx="30" cy="20" r="1.5" fill="#253248" />

    <!-- Combustion Chamber Body -->
    <path d="M 20 -2 L 65 2 L 65 38 L 20 42 Z" stroke-width="1.4" />
    <!-- Cooling Jacket Lines -->
    <line x1="32" y1="0" x2="32" y2="40" stroke="#475569" stroke-dasharray="2 2" stroke-width="0.8" />
    <line x1="45" y1="1" x2="45" y2="39" stroke="#475569" stroke-dasharray="2 2" stroke-width="0.8" />
    <line x1="58" y1="2" x2="58" y2="38" stroke="#475569" stroke-dasharray="2 2" stroke-width="0.8" />

    <!-- Nozzle Throat & Divergent Cone -->
    <path d="M 65 6 C 75 14, 85 10, 105 0 L 105 40 C 85 30, 75 26, 65 34 Z" stroke-width="1.5" />
    <ellipse cx="105" cy="20" rx="6" ry="20" stroke-width="1.5" />
  </g>
</svg>
