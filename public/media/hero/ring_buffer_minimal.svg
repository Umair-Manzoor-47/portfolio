<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140" fill="none" stroke="#253248" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Minimalist Outer & Inner Circular Ring Track -->
  <ellipse cx="110" cy="62" rx="72" ry="42" stroke="#1E293B" stroke-width="1.5" />
  <ellipse cx="110" cy="62" rx="46" ry="26" stroke="#1E293B" stroke-width="1.2" />

  <!-- 8 Clean Radial Slot Partitions -->
  <line x1="110" y1="20" x2="110" y2="36" stroke="#475569" stroke-width="1.2" />
  <line x1="110" y1="88" x2="110" y2="104" stroke="#475569" stroke-width="1.2" />
  <line x1="38" y1="62" x2="64" y2="62" stroke="#475569" stroke-width="1.2" />
  <line x1="156" y1="62" x2="182" y2="62" stroke="#475569" stroke-width="1.2" />
  <line x1="59" y1="33" x2="78" y2="44" stroke="#475569" stroke-width="1.2" />
  <line x1="161" y1="91" x2="142" y2="80" stroke="#475569" stroke-width="1.2" />
  <line x1="161" y1="33" x2="142" y2="44" stroke="#475569" stroke-width="1.2" />
  <line x1="59" y1="91" x2="78" y2="80" stroke="#475569" stroke-width="1.2" />

  <!-- Producer Pointer (Minimalist Arrow & Dot) -->
  <g transform="translate(110, 10)">
    <polygon points="0,0 -4,-7 4,-7" fill="#0284C7" stroke="#0284C7" />
    <text x="0" y="-10" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" font-weight="700" fill="#0284C7" letter-spacing="0.5">HEAD [WRITE]</text>
  </g>

  <!-- Consumer Pointer (Minimalist Arrow & Dot) -->
  <g transform="translate(178, 80)">
    <polygon points="0,0 8,3 6,-5" fill="#059669" stroke="#059669" />
    <text x="24" y="10" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" font-weight="700" fill="#059669" letter-spacing="0.5">TAIL [READ]</text>
  </g>

  <!-- Cacheline Isolation Axis Line -->
  <line x1="72" y1="62" x2="148" y2="62" stroke="#F59E0B" stroke-dasharray="2 2" stroke-width="1.2" />
  <circle cx="110" cy="62" r="3" fill="#F59E0B" />

  <!-- Minimal Blueprint Annotation -->
  <text x="110" y="128" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1">SPSC RING BUFFER</text>
  <line x1="45" y1="134" x2="175" y2="134" stroke="#94A3B8" stroke-dasharray="2 2" stroke-width="0.8" />
</svg>
