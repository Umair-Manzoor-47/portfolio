<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" fill="none" stroke="#253248" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- RAM DIMM Module PCB Board (Isometric View) -->
  <polygon points="20,40 230,15 240,85 30,110" fill="none" stroke="#1E293B" stroke-width="1.6" />

  <!-- PCB Key Notch (Bottom Edge) -->
  <polygon points="120,95 125,90 135,89 140,93" fill="none" stroke="#1E293B" stroke-width="1.4" />

  <!-- Gold Contact Finger Edge Pins along Bottom Edge -->
  <g stroke="#64748B" stroke-width="0.8">
    <line x1="38" y1="106" x2="40" y2="99" />
    <line x1="46" y1="105" x2="48" y2="98" />
    <line x1="54" y1="104" x2="56" y2="97" />
    <line x1="62" y1="103" x2="64" y2="96" />
    <line x1="70" y1="102" x2="72" y2="95" />
    <line x1="78" y1="101" x2="80" y2="94" />
    <line x1="86" y1="100" x2="88" y2="93" />
    <line x1="94" y1="99" x2="96" y2="92" />
    <line x1="102" y1="98" x2="104" y2="91" />
    <line x1="110" y1="97" x2="112" y2="90" />
    
    <!-- Right side of notch -->
    <line x1="146" y1="92" x2="148" y2="85" />
    <line x1="154" y1="91" x2="156" y2="84" />
    <line x1="162" y1="90" x2="164" y2="83" />
    <line x1="170" y1="89" x2="172" y2="82" />
    <line x1="178" y1="88" x2="180" y2="81" />
    <line x1="186" y1="87" x2="188" y2="80" />
    <line x1="194" y1="86" x2="196" y2="79" />
    <line x1="202" y1="85" x2="204" y2="78" />
    <line x1="210" y1="84" x2="212" y2="77" />
    <line x1="218" y1="83" x2="220" y2="76" />
    <line x1="226" y1="82" x2="228" y2="75" />
  </g>

  <!-- 4 DRAM Memory ICs (Isometric perspective on PCB) -->
  <!-- Chip 1 -->
  <polygon points="45,45 80,41 83,78 48,82" stroke="#334155" stroke-width="1.3" />
  <circle cx="52" cy="50" r="1.5" fill="#334155" />
  <line x1="55" y1="62" x2="73" y2="60" stroke="#94A3B8" stroke-dasharray="2 2" stroke-width="0.8" />

  <!-- Chip 2 -->
  <polygon points="88,40 123,36 126,73 91,77" stroke="#334155" stroke-width="1.3" />
  <circle cx="95" cy="45" r="1.5" fill="#334155" />
  <line x1="98" y1="57" x2="116" y2="55" stroke="#94A3B8" stroke-dasharray="2 2" stroke-width="0.8" />

  <!-- SPD / PMIC Hub Chip in Middle -->
  <polygon points="128,45 140,43 142,61 130,63" stroke="#0284C7" stroke-width="1.2" />

  <!-- Chip 3 -->
  <polygon points="146,33 181,29 184,66 149,70" stroke="#334155" stroke-width="1.3" />
  <circle cx="153" cy="38" r="1.5" fill="#334155" />
  <line x1="156" y1="50" x2="174" y2="48" stroke="#94A3B8" stroke-dasharray="2 2" stroke-width="0.8" />

  <!-- Chip 4 -->
  <polygon points="189,28 224,24 227,61 192,65" stroke="#334155" stroke-width="1.3" />
  <circle cx="196" cy="33" r="1.5" fill="#334155" />
  <line x1="199" y1="45" x2="217" y2="43" stroke="#94A3B8" stroke-dasharray="2 2" stroke-width="0.8" />

  <!-- High-Speed Data Bus Trace Routes -->
  <path d="M 65 80 L 65 95 M 108 75 L 108 90 M 166 68 L 166 83 M 209 63 L 209 78" stroke="#64748B" stroke-dasharray="2 2" stroke-width="0.8" />

  <!-- Blueprint Dimension Lines & Annotation -->
  <text x="130" y="128" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1">RAM BLUEPRINT // DDR5</text>
  <line x1="40" y1="134" x2="220" y2="134" stroke="#94A3B8" stroke-dasharray="2 2" stroke-width="0.8" />
</svg>
