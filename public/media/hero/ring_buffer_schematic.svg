<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" fill="none" stroke="#334155" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Circular Ring Buffer Track -->
  <ellipse cx="120" cy="95" rx="85" ry="50" stroke="#1E293B" stroke-width="1.6" />
  <ellipse cx="120" cy="95" rx="55" ry="32" stroke="#1E293B" stroke-width="1.2" />

  <!-- 12 Slot Radial Partitions -->
  <line x1="120" y1="45" x2="120" y2="63" stroke="#475569" stroke-width="1.2" />
  <line x1="120" y1="127" x2="120" y2="145" stroke="#475569" stroke-width="1.2" />
  <line x1="35" y1="95" x2="65" y2="95" stroke="#475569" stroke-width="1.2" />
  <line x1="175" y1="95" x2="205" y2="95" stroke="#475569" stroke-width="1.2" />
  <line x1="60" y1="60" x2="81" y2="72" stroke="#475569" stroke-width="1.2" />
  <line x1="180" y1="130" x2="159" y2="118" stroke="#475569" stroke-width="1.2" />
  <line x1="180" y1="60" x2="159" y2="72" stroke="#475569" stroke-width="1.2" />
  <line x1="60" y1="130" x2="81" y2="118" stroke="#475569" stroke-width="1.2" />

  <!-- Head Pointer (Producer Cursor) -->
  <g transform="translate(120, 30)">
    <polygon points="0,0 -8,-14 8,-14" fill="#0284C7" stroke="#0284C7" />
    <text x="0" y="-18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#0284C7">PRODUCER</text>
  </g>

  <!-- Tail Pointer (Consumer Cursor) -->
  <g transform="translate(195, 120)">
    <polygon points="0,0 12,8 16,-4" fill="#10B981" stroke="#10B981" />
    <text x="28" y="16" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#10B981">CONSUMER</text>
  </g>

  <!-- 128-Byte False Sharing Barrier Guard -->
  <line x1="75" y1="95" x2="165" y2="95" stroke="#F59E0B" stroke-dasharray="3 3" stroke-width="1.5" />
  <circle cx="120" cy="95" r="4" fill="#F59E0B" />

  <!-- Technical Spec Label Annotation -->
  <text x="120" y="185" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">alignas(128) SPSC RING</text>
  <line x1="50" y1="195" x2="190" y2="195" stroke="#94A3B8" stroke-dasharray="3 3" stroke-width="0.8" />
</svg>
