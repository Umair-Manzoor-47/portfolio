<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none" stroke="#253248" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <g transform="translate(180, 50) rotate(22)">
    <!-- Injector Dome & Propellant Manifold Tubes -->
    <ellipse cx="0" cy="0" rx="28" ry="12" stroke-width="1.5" />
    <ellipse cx="0" cy="-6" rx="20" ry="8" stroke-width="1.2" />
    
    <!-- Feed Pipe 1 (Oxidizer Inlet) -->
    <path d="M -18 -4 L -35 -25 L -55 -25 L -55 -10" stroke-width="1.4" />
    <circle cx="-55" cy="-10" r="3" />
    <path d="M -14 -4 L -30 -20 L -50 -20" stroke-width="1" />

    <!-- Feed Pipe 2 (Fuel Inlet & Turbopump Interface) -->
    <path d="M 18 -4 L 35 -30 L 60 -30 L 60 -15" stroke-width="1.4" />
    <circle cx="60" cy="-15" r="3" />

    <!-- Gimbal Ring Pivot Joint -->
    <ellipse cx="0" cy="15" rx="32" ry="14" stroke-width="1.5" />
    <line x1="-32" y1="15" x2="-38" y2="15" stroke-width="2" />
    <line x1="32" y1="15" x2="38" y2="15" stroke-width="2" />

    <!-- Cylindrical Combustion Chamber -->
    <path d="M -26 15 L -26 70 C -26 85, -16 95, -12 100" stroke-width="1.4" />
    <path d="M 26 15 L 26 70 C 26 85, 16 95, 12 100" stroke-width="1.4" />

    <!-- Regenerative Cooling Jacket Ribs -->
    <line x1="-22" y1="20" x2="-22" y2="70" stroke="#475569" stroke-width="0.8" />
    <line x1="-14" y1="23" x2="-14" y2="75" stroke="#475569" stroke-width="0.8" />
    <line x1="-6" y1="25" x2="-6" y2="78" stroke="#475569" stroke-width="0.8" />
    <line x1="2" y1="25" x2="2" y2="78" stroke="#475569" stroke-width="0.8" />
    <line x1="10" y1="24" x2="10" y2="76" stroke="#475569" stroke-width="0.8" />
    <line x1="18" y1="22" x2="18" y2="72" stroke="#475569" stroke-width="0.8" />

    <!-- Throats Ring (Narrowest Cross Section) -->
    <ellipse cx="0" cy="100" rx="12" ry="5" stroke-width="1.4" />

    <!-- Divergent Bell Nozzle Expansion Skirt -->
    <path d="M -12 100 C -16 130, -32 180, -65 240" stroke-width="1.6" />
    <path d="M 12 100 C 16 130, 32 180, 65 240" stroke-width="1.6" />

    <!-- Nozzle Exit Lip Flange -->
    <ellipse cx="0" cy="240" rx="65" ry="24" stroke-width="1.8" />
    <ellipse cx="0" cy="240" rx="63" ry="22" stroke="#64748B" stroke-dasharray="3 3" stroke-width="1" />

    <!-- Stiffener Rings along Bell -->
    <path d="M -24 140 C -10 148, 10 148, 24 140" stroke="#475569" stroke-width="1" />
    <path d="M -42 185 C -20 198, 20 198, 42 185" stroke="#475569" stroke-width="1" />

    <!-- External Manifold Feed Return Line -->
    <path d="M -55 -25 L -75 30 L -75 160 L -30 200" stroke-width="1.3" />
    <line x1="-75" y1="60" x2="-26" y2="60" stroke="#475569" stroke-width="0.8" />
    <line x1="-75" y1="120" x2="-15" y2="120" stroke="#475569" stroke-width="0.8" />
  </g>
</svg>
