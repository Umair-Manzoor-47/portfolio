<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background:#0F172A; font-family:'JetBrains Mono', Consolas, sans-serif;">
  <rect width="600" height="400" fill="#0B132B" />
  <rect x="20" y="20" width="560" height="360" rx="8" fill="#131C31" stroke="#253550" stroke-width="1.2" />
  
  <text x="40" y="55" fill="#38BDF8" font-size="14" font-weight="700">L2/L3 ORDER BOOK :: INTRUSIVE LIST</text>
  <text x="40" y="75" fill="#64748B" font-size="11">Constant time O(1) insert, cancel and price match</text>

  <!-- Price Levels -->
  <g transform="translate(40, 95)">
    <!-- Ask 2 -->
    <rect x="0" y="0" width="520" height="36" rx="4" fill="#1E293B" />
    <rect x="360" y="0" width="160" height="36" rx="4" fill="#E11D48" opacity="0.35" />
    <text x="15" y="23" fill="#FDA4AF" font-size="12" font-weight="700">ASK 98,451.00</text>
    <text x="210" y="23" fill="#E2E8F0" font-size="11">Qty: 6.420</text>
    <text x="380" y="23" fill="#FDA4AF" font-size="11" font-weight="700">O(1) Tail Enqueue</text>

    <!-- Ask 1 -->
    <rect x="0" y="44" width="520" height="36" rx="4" fill="#1E293B" />
    <rect x="420" y="44" width="100" height="36" rx="4" fill="#E11D48" opacity="0.45" />
    <text x="15" y="67" fill="#FDA4AF" font-size="12" font-weight="700">ASK 98,450.50</text>
    <text x="210" y="67" fill="#E2E8F0" font-size="11">Qty: 3.100</text>
    <text x="440" y="67" fill="#FDA4AF" font-size="11" font-weight="700">BEST ASK</text>

    <!-- Spread -->
    <rect x="0" y="88" width="520" height="28" fill="#090E1A" />
    <text x="180" y="106" fill="#FBBF24" font-size="11" font-weight="700">SPREAD: $0.50 (ZERO CROSSED)</text>

    <!-- Bid 1 -->
    <rect x="0" y="124" width="520" height="36" rx="4" fill="#1E293B" />
    <rect x="410" y="124" width="110" height="36" rx="4" fill="#059669" opacity="0.45" />
    <text x="15" y="147" fill="#6EE7B7" font-size="12" font-weight="700">BID 98,450.00</text>
    <text x="210" y="147" fill="#E2E8F0" font-size="11">Qty: 4.850</text>
    <text x="430" y="147" fill="#6EE7B7" font-size="11" font-weight="700">BEST BID</text>

    <!-- Bid 2 -->
    <rect x="0" y="168" width="520" height="36" rx="4" fill="#1E293B" />
    <rect x="340" y="168" width="180" height="36" rx="4" fill="#059669" opacity="0.35" />
    <text x="15" y="191" fill="#6EE7B7" font-size="12" font-weight="700">BID 98,449.50</text>
    <text x="210" y="191" fill="#E2E8F0" font-size="11">Qty: 8.910</text>
    <text x="380" y="191" fill="#6EE7B7" font-size="11" font-weight="700">O(1) Direct Insert</text>
  </g>

  <!-- Bottom Metric Callout -->
  <rect x="40" y="320" width="520" height="42" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="55" y="346" fill="#F8FAFC" font-size="12" font-weight="600">ZERO HEAP ALLOCATION ON HOT PATH :: PRE-ALLOCATED ARENA POOL</text>
</svg>
